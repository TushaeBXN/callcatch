# ------------------------------------------------------------
# .pre-commit-config.yaml
#
# "pre-commit" is a tool that runs checks automatically every time you
# run `git commit`. If a check fails, the commit is blocked.
#
# The check below is gitleaks, a secret scanner. It looks for things
# that resemble API keys or passwords and stops you from committing them.
#
# One-time setup (run inside your virtual environment):
#   pip install pre-commit      # installs the pre-commit tool
#   pre-commit install          # connects it to this repo's git commits
#   pre-commit run --all-files  # optional: scan every file right now
#
# Config taken from the gitleaks README (github.com/gitleaks/gitleaks),
# read on 2026-09-28. The README example pinned v8.24.2; the latest
# release shown at that time was v8.30.1, which is used here.
# VERIFY: Run `pre-commit autoupdate` to move to the newest release.
#
# Do NOT skip this hook (SKIP=gitleaks) unless a maintainer has
# confirmed the flagged text is a false alarm.
# ------------------------------------------------------------
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Local check: stops a commit if the Tier 1/Tier 2 safety wording in the
  # prompt and docs/call-flow.md stop matching. Uses only built-in Python.
  - repo: local
    hooks:
      - id: prompt-sync
        name: Prompt and call-flow safety wording match
        entry: python3 tests/check_prompt_sync.py
        language: system
        files: ^(prompts/base_system_prompt\.md|docs/call-flow\.md|tests/check_prompt_sync\.py)$
        pass_filenames: false

      # Rejects any client config that breaks the rules in backend/config_schema.py.
      # Runs when a config, the schema, or the validator changes. It validates
      # ALL configs, so a schema change can't silently break an existing client.
      # Uses the active Python, so your .venv must be on (it needs pyyaml).
      # If pyyaml is missing, the commit is BLOCKED (fail closed) with a message.
      - id: validate-client-configs
        name: Client configs are valid
        entry: python3 tests/validate_config.py
        language: system
        files: ^(clients/[^/]+/config\.yaml|backend/config_schema\.py|tests/validate_config\.py)$
        pass_filenames: false

      # Fails if docs/unit-economics.md no longer matches the calculator's real output.
      # Standard library only.
      - id: unit-economics-doc
        name: Unit-economics doc matches calculator output
        entry: python3 docs/build_unit_economics_doc.py --check
        language: system
        files: ^docs/(unit_economics\.py|unit-economics\.md|build_unit_economics_doc\.py|templates/unit-economics\.md\.tmpl)$
        pass_filenames: false
